  <style>
    .activity-list { max-height: 300px; overflow-y: auto; }
    .chart-column span {
      display: block;
      width: 100%;
      background: #007bff;
      transition: height 0.5s ease;
    }

    /* —— Modern user UI (dashboard) —— */
    .role-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0.35rem 0.75rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em;
      border: 1px solid transparent;
    }
    .role-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .role-user { background: rgba(59,130,246,0.12); color: #1d4ed8; border-color: rgba(59,130,246,0.25); }
    .role-user::before { background: #3b82f6; }
    .role-interlocuteur { background: rgba(245,158,11,0.14); color: #b45309; border-color: rgba(245,158,11,0.3); }
    .role-interlocuteur::before { background: #f59e0b; }
    .role-admin { background: rgba(239,68,68,0.12); color: #b91c1c; border-color: rgba(239,68,68,0.28); }
    .role-admin::before { background: #ef4444; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0.3rem 0.7rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 600;
      background: rgba(34,197,94,0.14); color: #15803d;
      border: 1px solid rgba(34,197,94,0.28);
    }
    .status-badge::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
    }
    .date-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0.3rem 0.65rem; border-radius: 8px;
      font-size: 0.8rem; font-weight: 500; color: #475569;
      background: #f1f5f9; border: 1px solid #e2e8f0; white-space: nowrap;
    }
    .date-pill i { font-size: 0.85rem; opacity: 0.7; }
    .user-avatar {
      width: 40px; height: 40px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.9rem;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff; flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
  </style>
  <script>
/* Thème AVANT paint — clé = adminHMD.colorTheme (main.js) */
(function () {
  try {
    var t = localStorage.getItem('adminHMD.colorTheme')
      || localStorage.getItem('theme')
      || localStorage.getItem('bs-theme');
    if (t !== 'dark' && t !== 'light') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-bs-theme', t);
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body>

                    <h2 class="h5 mb-1 section-title"><i class="bi bi-activity"></i><span>Team Activity</span></h2>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const API_BASE = 'http://localhost:8000';
    const token = localStorage.getItem('jwt_token');

    if (!token) {
        window.location.href = '/auth/login.html';
        return;
    }

    function fetchWithAuth(url, options = {}) {
        return fetch(url, {
            ...options,
            headers: {
                ...options.headers,
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        }).then(async res => {
            if (res.status === 401) {
                localStorage.removeItem('jwt_token');
                window.location.href = '/auth/login.html';
                return Promise.reject('Non authentifié');
            }
            if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
            }
            return res.json();
        });
    }

    // --- 1. Statistiques + Graphique ---
    fetchWithAuth(`${API_BASE}/api/admin/stats`)
        .then(data => {
            const enAttenteRib = data.en_attente_rib ?? 0;
            const crees = data.crees ?? 0;
            const ticketsARembourser = data.tickets_a_rembourser ?? 0;
            const ticketsARenvoyer = data.tickets_a_renvoyer ?? 0;
            const aevNonRecu = data.aev_non_recu ?? 0;
            const paiementMultiple = data.paiement_multiple ?? 0;

            const container = document.getElementById('stats-container');
            if (container) {
                container.innerHTML = `
                    <div class="row g-3">
                        <div class="col-12 col-sm-6 col-xl-4">
                            <article class="metric-card metric-warning">
                                <div class="metric-top">
                                    <span class="metric-label">En attente RIB</span>
                                    <span class="metric-icon"><i class="bi bi-clock"></i></span>
                                </div>
                                <div class="metric-value">${enAttenteRib}</div>
                                <div class="metric-meta">en attente de RIB</div>
                            </article>
                        </div>
                        <div class="col-12 col-sm-6 col-xl-4">
                            <article class="metric-card metric-primary">
                                <div class="metric-top">
                                    <span class="metric-label">Tickets actifs</span>
                                    <span class="metric-icon"><i class="bi bi-life-preserver"></i></span>
                                </div>
                                <div class="metric-value">${crees}</div>
                                <div class="metric-meta">créés récemment</div>
                            </article>
                        </div>
                        <div class="col-12 col-sm-6 col-xl-4">
                            <article class="metric-card metric-success">
                                <div class="metric-top">
                                    <span class="metric-label">À rembourser</span>
                                    <span class="metric-icon"><i class="bi bi-arrow-return-left"></i></span>
                                </div>
                                <div class="metric-value">${ticketsARembourser}</div>
                                <div class="metric-meta">tickets à rembourser</div>
                            </article>
                        </div>
                    </div>
                    <div class="row g-3 mt-3">
                        <div class="col-12 col-sm-6 col-xl-4">
                            <article class="metric-card metric-secondary">
                                <div class="metric-top">
                                    <span class="metric-label">À renvoyer</span>
                                    <span class="metric-icon"><i class="bi bi-send"></i></span>
                                </div>
                                <div class="metric-value">${ticketsARenvoyer}</div>
                                <div class="metric-meta">à expédier</div>
                            </article>
                        </div>
                        <div class="col-12 col-sm-6 col-xl-4">
                            <article class="metric-card metric-info">
                                <div class="metric-top">
                                    <span class="metric-label">AEV non reçu</span>
                                    <span class="metric-icon"><i class="bi bi-envelope"></i></span>
                                </div>
                                <div class="metric-value">${aevNonRecu}</div>
                                <div class="metric-meta">en attente de réception</div>
                            </article>
                        </div>
                        <div class="col-12 col-sm-6 col-xl-4">
                            <article class="metric-card metric-danger">
                                <div class="metric-top">
                                    <span class="metric-label">Paiement multiple</span>
                                    <span class="metric-icon"><i class="bi bi-cash-stack"></i></span>
                                </div>
                                <div class="metric-value">${paiementMultiple}</div>
                                <div class="metric-meta">paiements multiples</div>
                            </article>
                        </div>
                    </div>
                `;
            }

            if (data.monthlyStats) {
                const chartContainer = document.querySelector('.chart-bars');
                if (chartContainer) {
                    const months = Object.keys(data.monthlyStats);
                    const values = Object.values(data.monthlyStats);
                    const maxValue = Math.max(...values);
                    chartContainer.innerHTML = '';
                    months.forEach((month, index) => {
                        const value = values[index];
                        const heightPercent = maxValue > 0 ? (value / maxValue) * 100 : 0;
                        const bar = document.createElement('div');
                        bar.className = 'chart-column bar-' + Math.round(heightPercent);
                        bar.innerHTML = `<span style="height:${heightPercent}%;">${value}</span><small>${month}</small>`;
                        chartContainer.appendChild(bar);
                    });
                }
            }
        })
        .catch(err => {
            console.error('Erreur stats:', err);
            document.getElementById('stats-container').innerHTML = '<p class="text-danger">Erreur de chargement des statistiques</p>';
            const chartContainer = document.querySelector('.chart-bars');
            if (chartContainer) {
                chartContainer.innerHTML = '<p class="text-danger">Impossible de charger les statistiques.</p>';
            }
        });

    // --- 2. Activités ---
    fetchWithAuth(`${API_BASE}/api/admin/activities`)
        .then(activities => {
            const container = document.getElementById('activities-container');
            if (!container) return;
            if (activities.length === 0) {
                container.innerHTML = '<p class="text-muted">Aucune activité récente.</p>';
                return;
            }
            container.innerHTML = activities.map(a => `
                <div class="activity-item">
                    <span class="activity-dot bg-primary"></span>
                    <div>
                        <p class="mb-1 fw-semibold">${a.action}</p>
                        <p class="text-muted small mb-0">${a.user} - ${a.createdAt}</p>
                    </div>
                </div>
            `).join('');
        })
        .catch(err => console.error('Erreur activités:', err));

    // --- Helpers rôles & date ---
    const roleLabel = (role) => {
      const map = {
        'ROLE_USER': 'User',
        'ROLE_INTERLOCUTEUR': 'Interlocuteur',
        'ROLE_ADMIN': 'Admin'
      };
      return map[role] || role || '—';
    };
    const formatDate = (raw) => {
      if (!raw) return '—';
      const d = new Date(String(raw).replace(' ', 'T'));
      if (isNaN(d.getTime())) return raw;
      const jj = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const aaaa = d.getFullYear();
      return jj + '/' + mm + '/' + aaaa;
    };

    // --- 3. Utilisateurs récents ---
    fetchWithAuth(`${API_BASE}/api/admin/users`)
        .then(data => {
            const tbody = document.getElementById('users-container');
            if (!tbody) return;
            const list = Array.isArray(data) ? data : (data.users || []);
            if (!list.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Aucun utilisateur</td></tr>';
                return;
            }
            // Limiter aux 5 plus récents
            const recent = list.slice(0, 5);
            tbody.innerHTML = recent.map((u) => {
                const role = roleLabel(u.role);
                const roleClass =
                  u.role === 'ROLE_ADMIN' ? 'role-admin' :
                  u.role === 'ROLE_INTERLOCUTEUR' ? 'role-interlocuteur' :
                  'role-user';
                return `
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <div class="user-avatar">${(u.email || '?').charAt(0).toUpperCase()}</div>
                                <div>
                                    <p class="fw-semibold mb-0">${u.email || '—'}</p>
                                    <p class="text-muted small mb-0">ID #${u.id ?? '—'}</p>
                                </div>
                            </div>
                        </td>
                        <td><span class="role-badge ${roleClass}">${role}</span></td>
                        <td><span class="status-badge">Actif</span></td>
                        <td><span class="date-pill"><i class="bi bi-calendar3"></i>${formatDate(u.createdAt)}</span></td>
                    </tr>
                `;
            }).join('');
        })
        .catch(err => console.error('Erreur utilisateurs:', err));
});
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('jwt_token');
    if (!token) return;

    // Décoder le JWT pour extraire l'email
    function parseJwt(t) {
      try {
        const base64 = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const json = decodeURIComponent(atob(base64).split('').map(c =>
          '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
        ).join(''));
        return JSON.parse(json);
      } catch (e) {
        return null;
      }
    }

    const payload = parseJwt(token);
    const email = payload?.email || payload?.username || payload?.sub || 'Utilisateur';

    // Mettre à jour tous les endroits où l'email apparaît
    const sidebarStrong = document.querySelector('.sidebar-user strong');
    if (sidebarStrong) sidebarStrong.textContent = email;

    const navbarSpan = document.getElementById('navbarUserName');
    if (navbarSpan) navbarSpan.textContent = email;

    // Si un élément avec id="sidebarUserName" existe
    const sidebarUserName = document.getElementById('sidebarUserName');
    if (sidebarUserName) sidebarUserName.textContent = email;

    // Pour les pages qui ont un élément .profile-name (comme add-user.html)
    document.querySelectorAll('.profile-name').forEach(el => {
      if (el.id !== 'navbarUserName') el.textContent = email;
    });
  });
</script>
<script>
/* Active le lien du menu latéral selon la page courante */
(function () {
  function activateSidebarNav() {
    const path = (window.location.pathname || '').replace(/\\/g, '/');
    const file = path.split('/').pop() || 'index.html';
    const current = file.toLowerCase() || 'index.html';

    document.querySelectorAll('.admin-sidebar .sidebar-nav a.nav-link').forEach(function (link) {
      link.classList.remove('active');
      link.removeAttribute('aria-current');

      const href = (link.getAttribute('href') || '').split('?')[0].split('#')[0];
      const linkFile = href.split('/').pop().toLowerCase() || '';

      const isMatch =
        linkFile === current ||
        (current === '' && (linkFile === 'index.html' || linkFile === '')) ||
        (current === 'index.html' && (linkFile === 'index.html' || linkFile === ''));

      if (isMatch) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', activateSidebarNav);
  } else {
    activateSidebarNav();
  }
})();
</script>
