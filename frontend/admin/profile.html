<script>
/* Thème AVANT paint — clé = adminHMD.colorTheme (main.js) */
(function () {
  try {
    var t = localStorage.getItem('adminHMD.colorTheme')
      || localStorage.getItem('theme')
      || localStorage.getItem('bs-theme');
    if (t !== 'dark' && t !== 'light') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-bs-theme', t);
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const API_BASE = 'http://localhost:8000';
      const apiBase = `${API_BASE}/api/user`;
      const alertDiv = document.getElementById('profileAlert');
      const token = localStorage.getItem('jwt_token');

      if (!token) {
        window.location.href = '/auth/login.html';
        return;
      }

      function fetchWithAuth(url, options = {}) {
        return fetch(url, {
          ...options,
          headers: {
            ...options.headers,
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        }).then(async res => {
          if (res.status === 401) {
            localStorage.removeItem('jwt_token');
            window.location.href = '/auth/login.html';
            return Promise.reject('Non authentifié');
          }
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          return res.json();
        });
      }

      function loadProfile() {
        fetchWithAuth(`${apiBase}/profile`)
          .then(user => {
            document.getElementById('sidebarUserName').textContent = user.email;
            document.getElementById('navbarUserName').textContent = user.email;
            document.getElementById('profileEmailDisplay').textContent = user.email;
            document.getElementById('profileCreatedDisplay').textContent = user.createdAt || '—';

            document.getElementById('profileEmail').value = user.email;
            document.getElementById('profileBio').value = user.bio || '';

            // Le badge de vérification a été supprimé, donc rien à faire
          })
          .catch(err => {
            console.error('Erreur chargement profil:', err);
            alertDiv.textContent = 'Erreur de chargement du profil. Veuillez vous reconnecter.';
            alertDiv.className = 'alert alert-danger';
            alertDiv.classList.remove('d-none');
          });
      }

      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const passwordInput = document.getElementById('profilePassword');
      const passwordIcon = document.getElementById('passwordToggleIcon');

      togglePasswordBtn.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        passwordIcon.className = type === 'password' ? 'bi bi-eye-slash' : 'bi bi-eye';
      });

      const form = document.getElementById('profileForm');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        alertDiv.classList.add('d-none');

        const payload = {
          email: document.getElementById('profileEmail').value.trim(),
          bio: document.getElementById('profileBio').value.trim(),
          password: document.getElementById('profilePassword').value || undefined
        };

        fetchWithAuth(`${apiBase}/profile`, {
          method: 'PUT',
          body: JSON.stringify(payload)
        })
        .then(data => {
          if (data.success !== false) {
            alertDiv.textContent = 'Profil mis à jour avec succès !';
            alertDiv.className = 'alert alert-success';
            alertDiv.classList.remove('d-none');
            loadProfile();
          } else {
            alertDiv.textContent = data.message || 'Erreur lors de la mise à jour.';
            alertDiv.className = 'alert alert-danger';
            alertDiv.classList.remove('d-none');
          }
        })
        .catch(err => {
          alertDiv.textContent = 'Erreur réseau. Veuillez réessayer.';
          alertDiv.className = 'alert alert-danger';
          alertDiv.classList.remove('d-none');
          console.error(err);
        });
      });

      loadProfile();
    });
  </script>

<script>
/* Active le lien du menu latéral selon la page courante */
(function () {
  function activateSidebarNav() {
    const path = (window.location.pathname || '').replace(/\\/g, '/');
    const file = path.split('/').pop() || 'index.html';
    const current = file.toLowerCase() || 'index.html';

    document.querySelectorAll('.admin-sidebar .sidebar-nav a.nav-link').forEach(function (link) {
      link.classList.remove('active');
      link.removeAttribute('aria-current');

      const href = (link.getAttribute('href') || '').split('?')[0].split('#')[0];
      const linkFile = href.split('/').pop().toLowerCase() || '';

      const isMatch =
        linkFile === current ||
        (current === '' && (linkFile === 'index.html' || linkFile === '')) ||
        (current === 'index.html' && (linkFile === 'index.html' || linkFile === ''));

      if (isMatch) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', activateSidebarNav);
  } else {
    activateSidebarNav();
  }
})();
</script>
